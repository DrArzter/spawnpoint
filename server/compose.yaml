# Base taken verbatim from the owner's working config:
# https://github.com/DrArzter/my-docker-minecraft-server-config
# It already runs. Changes below are marked, and each one is for the project
# rather than for the game.

services:
  mc:
    # PROJECT: `stable` moves, so a start that breaks cannot be attributed.
    # Pin a dated tag before M0. Mods themselves persist in the volume —
    # REMOVE_OLD_MODS is false by default — so they do not re-resolve per boot;
    # the exposure is on a rebuild, not on a restart. See ADR-0008.
    image: itzg/minecraft-server:stable
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
    environment:
      CF_API_KEY: ${CF_API_KEY}
      EULA: "TRUE"
      TYPE: "FORGE"
      VERSION: "1.20.1"
      MEMORY: "4096M"
      DIFFICULTY: "2"
      ONLINE_MODE: "false"
      USE_MEOWICE_FLAGS: "true"
      TZ: "Europe/Warsaw"
      CURSEFORGE_FILES: |-
        @/extras/cf-mods.txt

      # PROJECT: the automation talks to the server over RCON — player count for
      # the idle watchdog, save before stop. In offline mode an op entry is a
      # name anyone reaching the port can claim, so ops stay empty and
      # administration goes through RCON instead. See ADR-0022.
      ENABLE_RCON: "TRUE"
      RCON_PASSWORD: ${RCON_PASSWORD:?set RCON_PASSWORD in .env}

      # PROJECT: generated from the link table from M4. Hand-maintained until then.
      ENFORCE_WHITELIST: "TRUE"

    volumes:
      - "./data:/data"
      - "./mods:/data/mods"
      - "./extras:/extras"

    # PROJECT: `always` fights an idle stop that stops the container rather than
    # the instance, and it hides a crash loop by restarting through it.
    restart: "no"

    # PROJECT: the image saves and stops cleanly on SIGTERM. Too short a grace
    # period turns every stop into an unclean shutdown — the one thing the backup
    # design cannot compensate for. 111 mods take a while to shut down.
    # See ADR-0010.
    stop_grace_period: 180s
