<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231a73e8'/%3E%3Cg fill='%23fff' transform='translate(4 4) scale(1)'%3E%3Cpath d='M12 3 20.5 7.9v8.2L12 21l-8.5-4.9V7.9L12 3Z' opacity='.32'/%3E%3Cpath d='M12 3l8.5 4.9L12 12.8 3.5 7.9 12 3Z'/%3E%3Cpath d='M3.5 7.9 12 12.8V21l-8.5-4.9V7.9Z' opacity='.78'/%3E%3Cpath d='M20.5 7.9 12 12.8V21l8.5-4.9V7.9Z' opacity='.5'/%3E%3Ccircle cx='12' cy='7.9' r='2.2' fill='%231a73e8'/%3E%3C/g%3E%3C/svg%3E" />
    <title>Spawnpoint</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500&family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap"
    />
    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
    <script>
      (() => {
        try {
          const saved = localStorage.getItem("spawnpoint.theme");
          const telegram = window.Telegram?.WebApp;
          const system = telegram?.initData
            ? telegram.colorScheme
            : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          const theme = saved === "light" || saved === "dark" ? saved : system;
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          document.querySelector('meta[name="theme-color"]')?.setAttribute("content", theme === "dark" ? "#222222" : "#ffffff");
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
