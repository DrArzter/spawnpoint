# Minecraft's part of the shared observability tier: its exporter's scrape job
# and its dashboards. A file of its own so a placed session on a slot other than
# zero, which runs without the tier until one Prometheus serves the whole host,
# can leave it out along with observability/compose.yaml (ADR-0054, phase 9).
services:
  prometheus:
    volumes:
      - ./observability/scrape/minecraft.yml:/etc/prometheus/scrape/minecraft.yml:ro
    depends_on:
      - minecraft-exporter

  grafana:
    volumes:
      - ./observability/grafana/dashboards/minecraft:/var/lib/grafana/dashboards/minecraft:ro
