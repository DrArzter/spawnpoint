# Base taken verbatim from the owner's working config:
# https://github.com/DrArzter/my-docker-minecraft-server-config
# It already runs. Changes below are marked, and each one is for the project
# rather than for the game.

services:
  mc:
    # PROJECT: `stable` moves, so a start that breaks cannot be attributed.
    # Mods themselves persist in the volume — REMOVE_OLD_MODS is false by
    # default — so they do not re-resolve per boot; the exposure is on a
    # rebuild, not on a restart. See ADR-0008.
    #
    # PROJECT: the java17 image, not the previous digest. That one carries
    # Temurin 25, on which spark's bundled async-profiler takes the JVM down
    # with a SIGSEGV in libasyncProfiler moments after the world loads —
    # reproduced locally on the same digest with the Prominence server pack.
    # Every Minecraft world here is 1.20.1, which wants Java 17 regardless.
    # The resolver in scripts/resolve-profile-mods.sh keeps its own pin: it
    # runs mc-image-helper to resolve mods and never starts a game.
    image: itzg/minecraft-server@sha256:313ccff00f77a538374f424d49c6bb5643195c6f351604888be8b9acea950ff3
    tty: true
    stdin_open: true
    ports:
      # The host port is the session's slot (ADR-0054): slot zero, and an
      # unplaced session, keep the game's own; the container never changes.
      - "${SPAWNPOINT_GAME_PORT:-25565}:25565"
    environment:
      CF_API_KEY: ${CF_API_KEY}
      EULA: "TRUE"
      TYPE: "FORGE"
      VERSION: "1.20.1"
      MEMORY: "4096M"
      ONLINE_MODE: "false"
      USE_MEOWICE_FLAGS: "true"
      TZ: "Europe/Warsaw"
      CURSEFORGE_FILES: |-
        @/extras/cf-mods.txt

      # PROJECT: the automation talks to the server over RCON — player count for
      # the idle watchdog, save before stop. In offline mode an op entry is a
      # name anyone reaching the port can claim, so ops stay empty and
      # administration goes through RCON instead. See ADR-0022.
      ENABLE_RCON: "TRUE"
      RCON_PASSWORD: ${RCON_PASSWORD:?set RCON_PASSWORD in .env}

      # PROJECT: a world that keeps a list of names is gated by it; a world that
      # keeps none is not gated at all (ADR-0066). These used to be TRUE for
      # every session, which with an empty list is a server nobody can join —
      # and the answer was to turn the whitelist off by hand after each start.
      # start-session.sh answers for the world it is starting; the default
      # keeps the gate for a session started outside it.
      ENABLE_WHITELIST: ${SPAWNPOINT_WHITELIST_ENABLED:-TRUE}
      ENFORCE_WHITELIST: ${SPAWNPOINT_WHITELIST_ENABLED:-TRUE}

      # PROJECT: the save folder in /data, which the backup contract archives
      # (MINECRAFT_LEVEL_NAME in games/minecraft/game.sh). Every world has a
      # data directory of its own, so the folder is never the world's id.
      # Pinned here, not left to the image's default.
      LEVEL: "world"

      # PROJECT: a world's game settings (games/minecraft/settings.json,
      # ADR-0064). The host exports the ones the world sets; an entry with no
      # value reaches the container only when exported, so a setting nobody
      # changed leaves the server as it was. Difficulty keeps its old default.
      DIFFICULTY: "${DIFFICULTY:-normal}"
      MODE:
      MAX_PLAYERS:
      MOTD:
      PVP:
      ALLOW_FLIGHT:
      SPAWN_MONSTERS:
      VIEW_DISTANCE:
      SIMULATION_DISTANCE:

    volumes:
      - "${SPAWNPOINT_WORLD_DATA_DIRECTORY:-./data}:/data"
      - "${SPAWNPOINT_WORLD_MODS_DIRECTORY:-./mods}:/data/mods"
      - "./extras:/extras"

    # PROJECT: `always` fights an idle stop that stops the container rather than
    # the instance, and it hides a crash loop by restarting through it.
    restart: "no"

    # PROJECT: the image saves and stops cleanly on SIGTERM. Too short a grace
    # period turns every stop into an unclean shutdown — the one thing the backup
    # design cannot compensate for. 111 mods take a while to shut down.
    # See ADR-0010.
    stop_grace_period: 180s

  # The game's own exporter, and the scrape job that finds it: both belong to
  # this game rather than to the shared observability tier
  # (observability/compose.yaml).
  minecraft-exporter:
    image: itzg/mc-monitor@sha256:0d6b89c29d93cfcfcfee7bfd8e3758ddf00e20eb157e3e9a6560a93fe7fe84d1
    command: export-for-prometheus
    environment:
      EXPORT_SERVERS: mc:25565
      TIMEOUT: 10s
    restart: "no"
