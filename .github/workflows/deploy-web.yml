name: Deploy web

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    environment:
      name: production
      url: ${{ steps.publish.outputs.url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AWS_REGION: eu-central-1
      AWS_PROFILE_NAME: ""
      TF_IN_AUTOMATION: "true"
      TF_VAR_aws_profile: ""
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Use Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts
        working-directory: web

      - name: Assume the production deployment role
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: spawnpoint-web

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Read production outputs
        run: |
          scripts/terraform-init-ci.sh infra/terraform-access-api
          scripts/terraform-init-ci.sh infra/terraform-web

      - name: Publish static application
        id: publish
        run: |
          scripts/deploy-web.sh | tee deploy-web.out
          echo "url=$(sed -n 's/^url=//p' deploy-web.out)" >> "${GITHUB_OUTPUT}"
