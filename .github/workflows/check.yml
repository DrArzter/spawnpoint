name: Check

# Every local rung of the evidence ladder, on the same command a developer runs.
# This workflow deliberately holds no cloud identity or secrets. It can update
# its own pull-request summary comment, but create nothing outside GitHub.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: scripts/check.sh
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out the commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The node tests run TypeScript directly, which needs a runtime that
      # strips types without a flag.
      - name: Use Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            lambdas/package-lock.json
            web/package-lock.json

      - name: Install the lambdas' dependencies
        run: npm ci --ignore-scripts
        working-directory: lambdas

      - name: Install the mini app's dependencies
        run: npm ci --ignore-scripts
        working-directory: web

      # Docker is preinstalled on the runner, which is what the containerised
      # server suite and the Terraform roots need.
      - name: Run every check
        id: checks
        run: |
          set +e
          scripts/check.sh 2>&1 | tee check-output.log
          exit_code="${PIPESTATUS[0]}"
          set -e
          echo "exit_code=${exit_code}" >> "${GITHUB_OUTPUT}"

      - name: Publish the test result on the pull request
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EXIT_CODE: ${{ steps.checks.outputs.exit_code }}
        run: |
          passed="$(grep -c '^ok  ' check-output.log 2>/dev/null || true)"
          failed="$(grep -c '^FAIL ' check-output.log 2>/dev/null || true)"
          if [[ "${EXIT_CODE:-1}" == "0" ]]; then
            heading="## Tests ✅"
          else
            heading="## Tests ❌"
          fi
          {
            echo '<!-- spawnpoint-tests-summary -->'
            echo "${heading}"
            echo
            echo "**${passed} passed · ${failed} failed**"
            if (( failed > 0 )); then
              echo
              echo "Failed steps:"
              grep '^FAIL ' check-output.log | sed 's/^FAIL /- `/' | sed 's/$/`/'
            fi
            echo
            echo "[Open the complete workflow log](${RUN_URL})"
          } > check-comment.md
          scripts/upsert-pr-comment.sh '<!-- spawnpoint-tests-summary -->' check-comment.md

      - name: Enforce the test result
        if: steps.checks.outputs.exit_code != '0'
        run: exit 1

      - name: Classify production changes
        if: github.event_name == 'push'
        run: python3 scripts/deployment_plan.py "${{ github.event.before }}" "${{ github.sha }}" > production-deployment-plan.json

      - name: Publish the tested deployment plan
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-deployment-plan
          path: production-deployment-plan.json
          if-no-files-found: error
          retention-days: 7
