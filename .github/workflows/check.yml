name: Check

# The local ladder remains one command. CI runs its independent groups in
# parallel, then preserves one stable required check for branch protection and
# the production workflow_run gate.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      terraform-roots: ${{ steps.roots.outputs.value }}
    steps:
      - name: Check out the commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Discover Terraform roots
        id: roots
        run: |
          roots="$(find infra -mindepth 1 -maxdepth 1 -type d -exec sh -c 'ls "$1"/*.tf >/dev/null 2>&1' _ {} \; -print | sort | jq -Rsc 'split("\n") | map(select(length > 0))')"
          echo "value=${roots}" >> "${GITHUB_OUTPUT}"

      - name: Run static shard
        run: scripts/check.sh static

  lambda-build:
    name: Lambda typecheck and bundles
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: lambdas/package-lock.json

      - name: Install the lambdas dependencies
        run: npm ci --ignore-scripts
        working-directory: lambdas

      - name: Typecheck and build Lambda bundles
        run: scripts/check.sh lambda-build

      - name: Share Lambda bundles with Terraform shards
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lambda-bundles
          path: lambdas/dist
          if-no-files-found: error
          retention-days: 1

  lambda-tests:
    name: Lambda tests (${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: lambdas/package-lock.json

      - name: Install the lambdas dependencies
        run: npm ci --ignore-scripts
        working-directory: lambdas

      - name: Run Lambda test shard
        run: scripts/check.sh lambda-test-shard "${{ matrix.shard }}" 4

  web:
    name: Web checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the mini app dependencies
        run: npm ci --ignore-scripts
        working-directory: web

      - name: Run web tests and build
        run: scripts/check.sh web

  ui:
    name: Breakpoint gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # The whole history, so the gate can see whether a pull request changed web/.
      - name: Check out the commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the mini app dependencies
        run: npm ci --ignore-scripts
        working-directory: web

      # The runner image carries Google Chrome; the gate drives it headless.
      # It skips when nothing under web/ (or its own wiring) changed since
      # UI_BASE: a pull request's base, or the commit a push replaced. A push
      # without a previous commit (a new branch) runs it in full.
      - name: Probe every page, state and menu at every step
        run: scripts/check.sh ui
        env:
          UI_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before != '0000000000000000000000000000000000000000' && github.event.before || '' }}
          UI_ADVISE: '1'

      - name: Keep the advisory report and its screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-audit-report
          path: web/out/ui-audit
          if-no-files-found: ignore
          retention-days: 14

  mcp:
    name: MCP checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Install the MCP dependencies
        run: npm ci --ignore-scripts
        working-directory: mcp

      - name: Run MCP tests and build
        run: scripts/check.sh mcp

  server-tests:
    name: Server tests (${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run server test shard
        run: scripts/check.sh server-suite-shard "${{ matrix.shard }}" 4

  server-compose:
    name: Server compose bindings
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run compose bindings
        run: scripts/check.sh server-compose

  terraform:
    name: Terraform (${{ matrix.root }})
    needs: [static, lambda-build]
    strategy:
      fail-fast: false
      matrix:
        root: ${{ fromJSON(needs.static.outputs.terraform-roots) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore Lambda bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lambda-bundles
          path: lambdas/dist

      - name: Run one Terraform root
        run: scripts/check.sh terraform-root "${{ matrix.root }}"

  check:
    name: scripts/check.sh
    if: always()
    needs: [static, lambda-build, lambda-tests, web, ui, mcp, server-tests, server-compose, terraform]
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Aggregate shard results
        id: checks
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          LAMBDA_BUILD_RESULT: ${{ needs.lambda-build.result }}
          LAMBDA_TESTS_RESULT: ${{ needs.lambda-tests.result }}
          WEB_RESULT: ${{ needs.web.result }}
          UI_RESULT: ${{ needs.ui.result }}
          MCP_RESULT: ${{ needs.mcp.result }}
          SERVER_TESTS_RESULT: ${{ needs.server-tests.result }}
          SERVER_COMPOSE_RESULT: ${{ needs.server-compose.result }}
          TERRAFORM_RESULT: ${{ needs.terraform.result }}
        run: |
          failed=0
          : > check-output.log
          for pair in "static:${STATIC_RESULT}" "lambda-build:${LAMBDA_BUILD_RESULT}" "lambda-tests:${LAMBDA_TESTS_RESULT}" "web:${WEB_RESULT}" "ui:${UI_RESULT}" "mcp:${MCP_RESULT}" "server-tests:${SERVER_TESTS_RESULT}" "server-compose:${SERVER_COMPOSE_RESULT}" "terraform:${TERRAFORM_RESULT}"; do
            name="${pair%%:*}"
            result="${pair#*:}"
            if [[ "${result}" == "success" ]]; then
              echo "ok  ${name}" | tee -a check-output.log
            else
              echo "FAIL ${name} (${result})" | tee -a check-output.log
              failed=1
            fi
          done
          echo "exit_code=${failed}" >> "${GITHUB_OUTPUT}"

      - name: Publish the test result on the pull request
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EXIT_CODE: ${{ steps.checks.outputs.exit_code }}
        run: |
          passed="$(grep -c '^ok  ' check-output.log 2>/dev/null || true)"
          failed="$(grep -c '^FAIL ' check-output.log 2>/dev/null || true)"
          if [[ "${EXIT_CODE:-1}" == "0" ]]; then
            heading="## Tests ✅"
          else
            heading="## Tests ❌"
          fi
          {
            echo '<!-- spawnpoint-tests-summary -->'
            echo "${heading}"
            echo
            echo "**${passed} shards passed · ${failed} failed**"
            if (( failed > 0 )); then
              echo
              echo "Failed shards:"
              grep '^FAIL ' check-output.log | sed 's/^FAIL /- `/' | sed 's/$/`/'
            fi
            echo
            echo "[Open the complete workflow log](${RUN_URL})"
          } > check-comment.md
          scripts/upsert-pr-comment.sh '<!-- spawnpoint-tests-summary -->' check-comment.md

      - name: Enforce the test result
        if: steps.checks.outputs.exit_code != '0'
        run: exit 1
