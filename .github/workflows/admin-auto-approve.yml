name: Admin pull request approval

# pull_request_target intentionally runs the workflow definition from main.
# Never check out or execute pull-request code in this privileged workflow.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  approve:
    name: Approve trusted admin author
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      AUTHOR: ${{ github.event.pull_request.user.login }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Approve only when the author currently has admin permission
        run: |
          permission="$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${AUTHOR}/permission" --jq '.permission')"
          if [[ "${permission}" != "admin" ]]; then
            echo "${AUTHOR} is not a repository admin; a collaborator must review this pull request."
            exit 0
          fi

          gh api --method POST "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" \
            -f event=APPROVE \
            -f body="Automatically approved because ${AUTHOR} is currently a repository admin."
