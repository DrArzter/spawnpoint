<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Spawnpoint</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500&family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap"
    />
    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
    <script>
      (() => {
        try {
          const saved = localStorage.getItem("spawnpoint.theme");
          const telegram = window.Telegram?.WebApp;
          const system = telegram?.initData
            ? telegram.colorScheme
            : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          const theme = saved === "light" || saved === "dark" ? saved : system;
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          document.querySelector('meta[name="theme-color"]')?.setAttribute("content", theme === "dark" ? "#202124" : "#ffffff");
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
