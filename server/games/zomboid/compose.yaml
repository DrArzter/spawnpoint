# Project Zomboid session. The image is reused packaging (ADR-0005) built on the
# official SteamCMD image; it runs RCON and, on SIGTERM, issues `save` then
# `quit` before exiting — which is what makes our stop contract safe here.
# `latest` moves, so pin a digest before this world's first AWS session.
services:
  zomboid:
    image: terule/pz-dedicated-server:latest
    ports:
      # The game speaks UDP on two ports; players arrive over the overlay, so
      # neither is public (ADR-0024 mode C).
      # The host ports follow the session's slot (ADR-0054) in form only: this
      # server tells its clients which port to use next, so it cannot yet run
      # on a slot other than zero — see GAME_SLOTTABLE in game.sh.
      - "${SPAWNPOINT_GAME_PORT:-16261}:16261/udp"
      - "${SPAWNPOINT_GAME_PORT_2:-16262}:16262/udp"
      # RCON stays host-local: the probe's transport, never a player surface.
      - "127.0.0.1:${SPAWNPOINT_RCON_PORT:-27015}:27015"
    environment:
      # The image documents no variable for the server name and none for
      # Workshop items, so this world is vanilla until the mod list can be
      # rendered into the server's own ini file. See docs/prior-art.md.
      RCON_PASSWORD: ${ZOMBOID_RCON_PASSWORD:?set ZOMBOID_RCON_PASSWORD in .env}
      ADMIN_PASSWORD: ${ZOMBOID_ADMIN_PASSWORD:?set ZOMBOID_ADMIN_PASSWORD in .env}
      MEMORY_XMX_GB: "${ZOMBOID_MEMORY_GB:-6}"
    volumes:
      # This mount is the game's Zomboid folder: Saves/, db/ and Server/ all
      # live inside it, which is what lets one archive hold a whole world.
      - "${SPAWNPOINT_WORLD_DATA_DIRECTORY:-./games/zomboid/data}:/project-zomboid-config"
      - "zomboid-server-files:/project-zomboid"
    restart: "no" # same reasoning as every other game service: a restart policy
    # would fight the idle stop and hide a crash loop.
    stop_grace_period: 180s

volumes:
  zomboid-server-files:
