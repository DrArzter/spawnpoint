# The host tier's configuration (observability/compose.host.yaml): the same
# host and container jobs as prometheus.yml, plus every session's exporter
# found through the Docker socket rather than named in a file. A container
# takes part by carrying three labels — see compose.minecraft-host-observability.yaml:
#   spawnpoint.scrape="true"        opt in
#   spawnpoint.scrape_port="8080"   the exporter's own port
#   spawnpoint.scrape_job="minecraft"
# and by joining the spawnpoint-observability network, which is where it is
# reached. Its Compose project names the world it serves.
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]

  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]

  - job_name: containers
    static_configs:
      - targets: [cadvisor:8080]

  - job_name: sessions
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      - source_labels: [__meta_docker_container_label_spawnpoint_scrape]
        regex: "true"
        action: keep
      # Discovery yields one target per network a container is on; keep the one
      # this Prometheus can reach.
      - source_labels: [__meta_docker_network_name]
        regex: spawnpoint-observability
        action: keep
      - source_labels: [__meta_docker_network_ip, __meta_docker_container_label_spawnpoint_scrape_port]
        regex: "(.+);(.+)"
        replacement: "$1:$2"
        target_label: __address__
      - source_labels: [__meta_docker_container_label_spawnpoint_scrape_job]
        target_label: job
      - source_labels: [__meta_docker_container_label_com_docker_compose_project]
        regex: "spawnpoint-(.+)"
        replacement: "$1"
        target_label: world
