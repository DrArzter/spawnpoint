name: Deploy infrastructure

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      roots:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_IN_AUTOMATION: "true"
      TF_VAR_aws_profile: ""
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_domain_name: ${{ vars.SPAWNPOINT_DOMAIN }}
      TF_VAR_panel_url: https://${{ vars.SPAWNPOINT_DOMAIN }}/
      TF_VAR_legacy_panel_url: ${{ vars.SPAWNPOINT_LEGACY_PANEL_URL }}
      TF_VAR_telegram_oidc_client_id: ${{ vars.TELEGRAM_OIDC_CLIENT_ID }}
      TF_VAR_alert_email: ${{ secrets.TF_VAR_ALERT_EMAIL }}
      TF_VAR_bootstrap_owner_telegram_id: ${{ secrets.TF_VAR_BOOTSTRAP_OWNER_TELEGRAM_ID }}
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Assume the production deployment role
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: spawnpoint-infrastructure

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Build Lambda bundles consumed by Terraform
        run: |
          npm ci --ignore-scripts
          npm run build
        working-directory: lambdas

      - name: Apply changed roots without destructive actions
        env:
          TERRAFORM_ROOTS: ${{ inputs.roots }}
        run: |
          jq -r '.[]' <<<"${TERRAFORM_ROOTS}" | while IFS= read -r root; do
            scripts/terraform-apply-safe.sh "${root}"
          done
