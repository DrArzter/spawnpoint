<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#11151b" />
    <title>Spawnpoint</title>
    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
    <script>
      (() => {
        try {
          const saved = localStorage.getItem("spawnpoint.theme");
          const telegram = window.Telegram?.WebApp;
          const system = telegram?.initData
            ? telegram.colorScheme
            : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          const theme = saved === "light" || saved === "dark" ? saved : system;
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch {}
      })();
    </script>
  </head>
  <body>
    <!--
      THESIS: Spawnpoint is one continuous operations workspace; it refuses a dashboard made from disconnected decorative cards.
      OWN-WORLD: Cool neutral planes, cobalt actions, hairline divisions, low-radius controls, explicit status color and one restrained elevation level.
      STORY: Choose a game and world, read observed state, perform a permitted operation, then verify the recorded outcome.
      FIRST VIEWPORT: Persistent navigation and context frame a full-width world command surface; state and its primary action share one horizontal decision line.
      FORM: Established cloud console; seed=pinned-gcp-console, retained from the user's approved direction and rebuilt as a coherent component system.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
