name: Deploy pipeline identities

on:
  workflow_call:
    inputs:
      tested_sha:
        description: Commit on main whose Check workflow produced the deployment plan.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  identity:
    environment: production-identity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_IN_AUTOMATION: "true"
      TF_VAR_aws_profile: ""
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
    steps:
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Verify main still names the tested commit
        env:
          TESTED_SHA: ${{ inputs.tested_sha }}
        run: |
          [[ "$(git rev-parse HEAD)" == "${TESTED_SHA}" ]] || {
            echo "main advanced after this Check run; refusing to execute an older production revision" >&2
            exit 1
          }

      - name: Assume the identity-admin role
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_IDENTITY_ROLE_ARN }}
          role-session-name: spawnpoint-identity

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Apply the GitHub identities without destructive actions
        run: scripts/terraform-apply-safe.sh infra/terraform-github
