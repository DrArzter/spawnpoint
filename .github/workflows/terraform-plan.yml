name: Terraform plan

# The production-plan environment is owner-reviewed. Its OIDC role can only
# read the existing infrastructure and state; this workflow never applies.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    name: Terraform production plan
    environment: production-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_IN_AUTOMATION: "true"
      TF_VAR_aws_profile: ""
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_domain_name: ${{ vars.SPAWNPOINT_DOMAIN }}
      TF_VAR_panel_url: https://${{ vars.SPAWNPOINT_DOMAIN }}/
      TF_VAR_legacy_panel_url: ${{ vars.SPAWNPOINT_LEGACY_PANEL_URL }}
      TF_VAR_alert_email: ${{ secrets.TF_VAR_ALERT_EMAIL }}
      TF_VAR_bootstrap_owner_telegram_id: ${{ secrets.TF_VAR_BOOTSTRAP_OWNER_TELEGRAM_ID }}

    steps:
      - name: Check out the pull request commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Select affected Terraform roots
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 scripts/deployment_plan.py "${BASE_SHA}" "${HEAD_SHA}" > pull-request-plan.json
          echo "roots=$(jq -c '.terraform_plan_roots' pull-request-plan.json)" >> "${GITHUB_OUTPUT}"

      - name: Assume the read-only production plan role
        if: steps.changes.outputs.roots != '[]'
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          role-session-name: spawnpoint-pr-plan-${{ github.event.pull_request.number }}

      - name: Install Terraform
        if: steps.changes.outputs.roots != '[]'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Build Lambda bundles consumed by Terraform
        if: steps.changes.outputs.roots != '[]'
        run: |
          npm ci --ignore-scripts
          npm run build
        working-directory: lambdas

      - name: Plan affected roots and reject destructive changes
        id: terraform
        if: steps.changes.outputs.roots != '[]'
        env:
          TERRAFORM_ROOTS: ${{ steps.changes.outputs.roots }}
        run: |
          : > terraform-plan-results.txt
          failed=0
          while IFS= read -r root; do
            if result="$(scripts/terraform-plan-safe.sh "${root}")"; then
              printf '%s\n' "${result}" >> terraform-plan-results.txt
            else
              printf '%s\n' "${result}" >> terraform-plan-results.txt
              failed=1
            fi
          done < <(jq -r '.[]' <<<"${TERRAFORM_ROOTS}")
          exit "${failed}"

      - name: Record that no production Terraform roots changed
        if: steps.changes.outputs.roots == '[]'
        run: echo "No production Terraform roots changed." >> "${GITHUB_STEP_SUMMARY}"

      - name: Publish the Terraform result on the pull request
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ROOTS: ${{ steps.changes.outputs.roots }}
          PLAN_OUTCOME: ${{ steps.terraform.outcome }}
        run: |
          if [[ "${ROOTS}" == "[]" ]]; then
            heading="## Terraform plan ✅"
          elif [[ "${PLAN_OUTCOME}" == "success" ]]; then
            heading="## Terraform plan ✅"
          else
            heading="## Terraform plan ❌"
          fi
          {
            echo '<!-- spawnpoint-terraform-summary -->'
            echo "${heading}"
            echo
            if [[ "${ROOTS}" == "[]" ]]; then
              echo "No production Terraform roots changed."
            elif [[ -s terraform-plan-results.txt ]]; then
              echo '| Root | Add | Change | Delete | Read | Result |'
              echo '| --- | ---: | ---: | ---: | ---: | --- |'
              while IFS= read -r line; do
                [[ "${line}" == root=* ]] || continue
                root=""; add=0; change=0; delete=0; read=0; allowed=0; stale=0; result=error
                for field in ${line}; do
                  key="${field%%=*}"
                  value="${field#*=}"
                  case "${key}" in
                    root) root="${value}" ;;
                    add) add="${value}" ;;
                    change) change="${value}" ;;
                    delete) delete="${value}" ;;
                    read) read="${value}" ;;
                    allowed) allowed="${value}" ;;
                    stale) stale="${value}" ;;
                    result) result="${value}" ;;
                  esac
                done
                detail=""
                if (( allowed > 0 )); then detail=" (${allowed} allow-listed)"; fi
                if (( stale > 0 )); then detail="${detail} (${stale} stale)"; fi
                echo "| \`${root}\` | ${add} | ${change} | ${delete} | ${read} | ${result}${detail} |"
              done < terraform-plan-results.txt
            else
              echo "The plan stopped before a resource summary was available. Open the workflow log for the failing step."
            fi
            echo
            echo "A delete or replacement fails this required check unless the root's destroy-allowed.txt names its exact address and the type is one the pipeline may destroy. [Open the complete workflow log](${RUN_URL})"
          } > terraform-comment.md
          cp terraform-comment.md "${GITHUB_STEP_SUMMARY}"
          scripts/upsert-pr-comment.sh '<!-- spawnpoint-terraform-summary -->' terraform-comment.md
