# Base taken verbatim from the owner's working config:
# https://github.com/DrArzter/my-docker-minecraft-server-config
# It already runs. Changes below are marked, and each one is for the project
# rather than for the game.

services:
  mc:
    # PROJECT: `stable` moves, so a start that breaks cannot be attributed.
    # This digest is the amd64 image that passed the owner's local lifecycle and
    # restored-world smoke tests. Mods themselves persist in the volume —
    # REMOVE_OLD_MODS is false by default — so they do not re-resolve per boot;
    # the exposure is on a rebuild, not on a restart. See ADR-0008.
    image: itzg/minecraft-server@sha256:7423a4cf59ec510a58294f853fc7b07cdf0a50c5bc4618ee172327d7913941eb
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
    environment:
      CF_API_KEY: ${CF_API_KEY}
      EULA: "TRUE"
      TYPE: "FORGE"
      VERSION: "1.20.1"
      MEMORY: "4096M"
      DIFFICULTY: "2"
      ONLINE_MODE: "false"
      USE_MEOWICE_FLAGS: "true"
      TZ: "Europe/Warsaw"
      CURSEFORGE_FILES: |-
        @/extras/cf-mods.txt

      # PROJECT: the automation talks to the server over RCON — player count for
      # the idle watchdog, save before stop. In offline mode an op entry is a
      # name anyone reaching the port can claim, so ops stay empty and
      # administration goes through RCON instead. See ADR-0022.
      ENABLE_RCON: "TRUE"
      RCON_PASSWORD: ${RCON_PASSWORD:?set RCON_PASSWORD in .env}

      # PROJECT: generated from the link table from M4. Hand-maintained until then.
      ENFORCE_WHITELIST: "TRUE"

    volumes:
      - "./data:/data"
      - "./mods:/data/mods"
      - "./extras:/extras"

    # PROJECT: `always` fights an idle stop that stops the container rather than
    # the instance, and it hides a crash loop by restarting through it.
    restart: "no"

    # PROJECT: the image saves and stops cleanly on SIGTERM. Too short a grace
    # period turns every stop into an unclean shutdown — the one thing the backup
    # design cannot compensate for. 111 mods take a while to shut down.
    # See ADR-0010.
    stop_grace_period: 180s

  minecraft-exporter:
    image: itzg/mc-monitor@sha256:0d6b89c29d93cfcfcfee7bfd8e3758ddf00e20eb157e3e9a6560a93fe7fe84d1
    command: export-for-prometheus
    environment:
      EXPORT_SERVERS: mc:25565
      TIMEOUT: 10s
    restart: "no"

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.11.1@sha256:0f422f62c15f154af8d8572b23d623aebfb10cec73a5c654d18f911f3f9df241
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+)($$|/)
    pid: host
    volumes:
      - /:/host:ro,rslave
    restart: "no"

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.5@sha256:763aecf1c32c2be8a1a75f9abfc2fc461005c9dbbaa39cb356b354aac1296dbe
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    restart: "no"

  prometheus:
    image: prom/prometheus:v3.5.3@sha256:ddc2493835a1509976d5e4e0c94199c4f843ce1f42dd6bcfc8231ba734a93ff7
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=2GB
    ports:
      - "${OBSERVABILITY_BIND_ADDRESS:-127.0.0.1}:9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - minecraft-exporter
      - node-exporter
      - cadvisor
    restart: "no"

  grafana:
    image: grafana/grafana:13.1.0@sha256:121a7a9ece6dc10b969f1f96eed64b4f07dfac0d0b8abc070f7cb83bbde86f63
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # The dashboard uses only built-in panels. Suggested plugin downloads make
      # every session start slower and mutate an otherwise pinned installation.
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    ports:
      - "${GRAFANA_BIND_ADDRESS:-127.0.0.1}:3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: "no"

volumes:
  prometheus-data:
  grafana-data:
