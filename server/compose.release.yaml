# The mod directory has already been reconciled against an immutable release
# manifest. Starting a session must not resolve CurseForge again or delete JARs
# that are absent from a mutable upstream list.
services:
  mc:
    environment:
      CURSEFORGE_FILES: !reset null
      REMOVE_OLD_MODS: "false"
      TYPE: ${SPAWNPOINT_MINECRAFT_TYPE:-FORGE}
      VERSION: ${SPAWNPOINT_MINECRAFT_VERSION:-1.20.1}
      FORGE_VERSION: ${SPAWNPOINT_MINECRAFT_LOADER_VERSION:-47.4.10}
      NEOFORGE_VERSION: ${SPAWNPOINT_MINECRAFT_LOADER_VERSION:-latest}
      FABRIC_LOADER_VERSION: ${SPAWNPOINT_MINECRAFT_LOADER_VERSION:-latest}
      QUILT_LOADER_VERSION: ${SPAWNPOINT_MINECRAFT_LOADER_VERSION:-latest}
