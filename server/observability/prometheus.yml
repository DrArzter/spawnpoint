global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

# A game contributes its own jobs as a file here; a session for a game with no
# exporter simply matches nothing, which Prometheus accepts.
scrape_config_files:
  - /etc/prometheus/scrape/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]

  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]

  - job_name: containers
    static_configs:
      - targets: [cadvisor:8080]
